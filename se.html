<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Performance Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#3b82f6);
}

.container{
width:650px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
box-shadow:0 8px 30px rgba(0,0,0,.4);
color:white;
}

h1{
text-align:center;
margin-bottom:20px;
font-size:32px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
font-size:16px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
margin-top:15px;
background:#06b6d4;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0891b2;
}

.result{
display:none;
margin-top:25px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.15);
}

.progress{
width:100%;
height:25px;
background:white;
border-radius:30px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:0%;
background:limegreen;
transition:1s;
}

.info{
margin-top:15px;
font-size:18px;
line-height:2;
}

.grade{
font-size:28px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>🎓 Student Performance Dashboard</h1>

<input type="text" id="name" placeholder="Student Name">

<div class="row">
<input type="number" id="s1" placeholder="Subject 1">
<input type="number" id="s2" placeholder="Subject 2">
<input type="number" id="s3" placeholder="Subject 3">
<input type="number" id="s4" placeholder="Subject 4">
<input type="number" id="s5" placeholder="Subject 5">
</div>

<button onclick="calculate()">Calculate Result</button>

<div class="result" id="result">

<h2 id="studentName"></h2>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="info" id="output"></div>

</div>

</div>

<script>

function calculate(){

let name=document.getElementById("name").value;

let s1=Number(document.getElementById("s1").value);
let s2=Number(document.getElementById("s2").value);
let s3=Number(document.getElementById("s3").value);
let s4=Number(document.getElementById("s4").value);
let s5=Number(document.getElementById("s5").value);

let total=s1+s2+s3+s4+s5;
let average=total/5;

let grade;
let status;

if(average>=90){
grade="A+";
status="Excellent 🌟";
}
else if(average>=80){
grade="A";
status="Very Good ⭐";
}
else if(average>=70){
grade="B";
status="Good 👍";
}
else if(average>=60){
grade="C";
status="Acceptable ✅";
}
else{
grade="F";
status="Failed ❌";
}

document.getElementById("result").style.display="block";

document.getElementById("studentName").innerHTML =
"👨‍🎓 " + name;

document.getElementById("bar").style.width =
average + "%";

if(average>=80)
document.getElementById("bar").style.background="limegreen";
else if(average>=60)
document.getElementById("bar").style.background="orange";
else
document.getElementById("bar").style.background="red";

document.getElementById("output").innerHTML=
`
<b>Total Marks:</b> ${total}/500 <br>
<b>Average:</b> ${average.toFixed(2)}% <br>
<b>Grade:</b> <span class="grade">${grade}</span><br>
<b>Status:</b> ${status}
`;

}

</script>

</body>
</html>
